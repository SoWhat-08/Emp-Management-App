services:
  db:
    image: postgres:16-alpine
    container_name: employee-db
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee123
    volumes:
      - employee-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U employee -d employeedb"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: employee-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/employeedb
      SPRING_DATASOURCE_USERNAME: employee
      SPRING_DATASOURCE_PASSWORD: employee123
    depends_on:
      db:
        condition: service_healthy
    expose: ["8060"]
  frontend:
    build: ./frontend
    container_name: employee-frontend
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  employee-data:
